name: CI/CD - bibliotheque (examen)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bibliotheque:latest

    steps:
      # 1. Recuperer le code (historique complet pour Gitleaks et SonarCloud)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detection de secrets avec Gitleaks
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

      # 3. Installer Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 4. Compilation
      - name: Compile Java
        run: mvn -B compile

      # 5. Tests unitaires + packaging du jar (+ rapport de couverture JaCoCo)
      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      # 6. Analyse de qualite et de securite du code avec SonarCloud
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # 7. Construction de l'image Docker
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # 8. Test de l'image : le conteneur doit repondre
      - name: Test Docker image locally
        run: |
          docker run -d --name bibliotheque-test -p 8080:8080 $DOCKER_IMAGE_NAME
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/api/livres
          docker logs bibliotheque-test
          docker stop bibliotheque-test
          docker rm bibliotheque-test

      # 9. Scan des vulnerabilites de l'image avec Trivy (rapport JSON)
      - name: Trivy report (json)
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      # Trivy : tableau lisible dans les logs
      - name: Scan Docker image with Trivy (table)
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_NO_PROGRESS: "true"
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 10. Publication sur Docker Hub (seulement sur push vers main)
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $DOCKER_IMAGE_NAME
